<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">Shopping Assistant - Tư vấn điện thoại AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f0f2f5;
        color: #1c1c1e;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── HEADER ── */
      header {
        background: #1a1a2e;
        color: #fff;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        flex-shrink: 0;
      }
      header .logo {
        font-size: 1.5rem;
      }
      header h1 {
        font-size: 1.1rem;
        font-weight: 600;
      }
      header .sub {
        font-size: 0.78rem;
        color: #aaa;
        margin-left: auto;
      }
      .badge {
        background: #16213e;
        border: 1px solid #0f3460;
        color: #e94560;
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 20px;
        font-weight: 600;
      }

      /* ── TABS ── */
      .tabs {
        display: flex;
        background: #fff;
        border-bottom: 1px solid #ddd;
        flex-shrink: 0;
      }
      .tab-btn {
        padding: 10px 24px;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 0.9rem;
        color: #666;
        border-bottom: 3px solid transparent;
        transition: all 0.2s;
      }
      .tab-btn.active {
        color: #e94560;
        border-bottom-color: #e94560;
        font-weight: 600;
      }
      .tab-btn:hover:not(.active) {
        background: #f5f5f5;
      }

      /* ── MAIN LAYOUT ── */
      .tab-panel {
        display: none;
        flex: 1;
        overflow: hidden;
      }
      .tab-panel.active {
        display: flex;
      }

      /* ── CHAT PANEL ── */
      #panel-chat {
        flex-direction: column;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .msg {
        display: flex;
        gap: 10px;
        max-width: 820px;
      }
      .msg.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .msg.bot {
        align-self: flex-start;
      }

      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        flex-shrink: 0;
      }
      .msg.user .avatar {
        background: #e94560;
      }
      .msg.bot .avatar {
        background: #1a1a2e;
      }

      .bubble {
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 0.9rem;
        line-height: 1.55;
        max-width: 680px;
      }
      .msg.user .bubble {
        background: #e94560;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.bot .bubble {
        background: #fff;
        border: 1px solid #e8e8e8;
        border-bottom-left-radius: 4px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }

      /* Markdown trong bubble */
      .bubble h1,
      .bubble h2,
      .bubble h3 {
        margin: 0.5em 0 0.3em;
        font-size: 1em;
      }
      .bubble p {
        margin-bottom: 0.5em;
      }
      .bubble ul,
      .bubble ol {
        padding-left: 1.4em;
        margin-bottom: 0.5em;
      }
      .bubble li {
        margin-bottom: 0.2em;
      }
      .bubble strong {
        font-weight: 700;
      }
      .bubble table {
        border-collapse: collapse;
        width: 100%;
        margin: 0.5em 0;
        font-size: 0.85em;
      }
      .bubble th,
      .bubble td {
        border: 1px solid #ddd;
        padding: 5px 10px;
        text-align: left;
      }
      .bubble th {
        background: #f5f5f5;
        font-weight: 600;
      }
      .bubble code {
        background: #f0f0f0;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 0.85em;
      }
      .bubble pre {
        background: #f0f0f0;
        padding: 10px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 0.5em 0;
      }

      .meta {
        font-size: 0.72rem;
        color: #999;
        margin-top: 4px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .meta .tool-tag {
        background: #eef;
        color: #667;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 0.68rem;
      }
      .warning-msg {
        background: #fff8e1;
        border: 1px solid #ffca28;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.82rem;
        color: #7b5b00;
        margin-top: 6px;
        max-width: 680px;
      }

      .typing {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 8px 0;
      }
      .typing span {
        width: 8px;
        height: 8px;
        background: #aaa;
        border-radius: 50%;
        animation: blink 1.2s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
      }

      /* ── INPUT BAR ── */
      .input-bar {
        padding: 14px 20px;
        background: #fff;
        border-top: 1px solid #e8e8e8;
        display: flex;
        gap: 10px;
        flex-shrink: 0;
      }
      .input-bar textarea {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid #ddd;
        border-radius: 12px;
        font-size: 0.9rem;
        font-family: inherit;
        resize: none;
        outline: none;
        height: 44px;
        transition: border-color 0.2s;
        max-height: 120px;
        overflow-y: auto;
      }
      .input-bar textarea:focus {
        border-color: #e94560;
      }
      .send-btn {
        padding: 0 20px;
        border-radius: 12px;
        background: #e94560;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      .send-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .send-btn:not(:disabled):hover {
        background: #c73652;
      }

      /* ── PRODUCTS PANEL ── */
      #panel-products {
        flex-direction: column;
        overflow-y: auto;
        padding: 20px;
        gap: 16px;
      }
      .products-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .products-header h2 {
        font-size: 1.1rem;
        font-weight: 600;
      }
      .refresh-btn {
        padding: 6px 14px;
        border: 1.5px solid #e94560;
        color: #e94560;
        background: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s;
      }
      .refresh-btn:hover {
        background: #e94560;
        color: #fff;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      .product-card {
        background: #fff;
        border-radius: 12px;
        border: 1px solid #e8e8e8;
        padding: 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        transition:
          box-shadow 0.2s,
          transform 0.2s;
      }
      .product-card:hover {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
      }
      .product-card .brand-badge {
        display: inline-block;
        font-size: 0.7rem;
        background: #1a1a2e;
        color: #fff;
        padding: 2px 8px;
        border-radius: 20px;
        margin-bottom: 8px;
      }
      .product-card h3 {
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .product-card .price {
        font-size: 1rem;
        font-weight: 700;
        color: #e94560;
        margin: 6px 0;
      }
      .product-card .specs {
        font-size: 0.78rem;
        color: #666;
        margin-top: 8px;
      }
      .product-card .specs li {
        list-style: none;
        padding: 2px 0;
      }
      .product-card .specs li::before {
        content: "- ";
        color: #999;
      }
      .ask-btn {
        margin-top: 12px;
        width: 100%;
        padding: 7px;
        border: 1.5px solid #e94560;
        color: #e94560;
        background: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.82rem;
        transition: all 0.2s;
      }
      .ask-btn:hover {
        background: #e94560;
        color: #fff;
      }
      .stock-badge {
        display: inline-block;
        font-size: 0.72rem;
        padding: 2px 8px;
        border-radius: 20px;
        font-weight: 600;
        margin-left: 6px;
      }
      .stock-ok {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .stock-low {
        background: #fff8e1;
        color: #f57f17;
      }
      .stock-out {
        background: #ffebee;
        color: #c62828;
      }

      .products-source {
        font-size: 0.8rem;
        color: #777;
        margin-top: 2px;
      }

      /* ── EMBED (/embed: chat only, inside the Odoo website) ── */
      body.embed header {
        padding: 10px 14px;
      }
      body.embed header .sub,
      body.embed .tab-btn {
        display: none;
      }
      body.embed .tabs {
        justify-content: flex-end;
      }

      /* ── HEALTH PANEL ── */
      #panel-health {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        overflow-y: auto;
        gap: 12px;
        padding: 30px;
      }
      .health-card {
        background: #fff;
        border-radius: 12px;
        border: 1px solid #e8e8e8;
        padding: 20px 30px;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .health-card h2 {
        margin-bottom: 14px;
        font-size: 1rem;
        font-weight: 700;
      }
      .health-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .health-row:last-child {
        border-bottom: none;
      }
      .health-row .ok {
        color: #2e7d32;
        font-weight: 700;
      }
      .health-row .fail {
        color: #c62828;
        font-weight: 700;
      }
      .health-refresh {
        padding: 8px 20px;
        background: #1a1a2e;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.2s;
      }
      .health-refresh:hover {
        background: #0f3460;
      }

      .new-chat-btn {
        margin-left: auto;
        margin-right: 12px;
        padding: 6px 14px;
        border: 1.5px solid #e94560;
        color: #e94560;
        background: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: all 0.2s;
        align-self: center;
      }
      .new-chat-btn:hover {
        background: #e94560;
        color: #fff;
      }

      .session-info {
        font-size: 0.68rem;
        color: #999;
        text-align: center;
        padding: 4px;
        background: #f8f8f8;
        border-bottom: 1px solid #eee;
      }
      /* ── STREAMING + ORDER CONFIRMATION ── */
      .status-line {
        font-size: 0.8rem;
        color: #667;
        margin-bottom: 6px;
      }
      .status-line:empty {
        display: none;
      }
      .confirm-card {
        border: 1px solid #ffd0d8;
        background: #fff7f8;
        border-radius: 10px;
        padding: 12px 14px;
        margin-top: 8px;
      }
      .confirm-card h4 {
        font-size: 0.92rem;
        margin-bottom: 8px;
      }
      .confirm-card table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        margin-bottom: 10px;
      }
      .confirm-card td {
        padding: 3px 0;
      }
      .confirm-card td:last-child {
        text-align: right;
        font-weight: 600;
      }
      .confirm-actions {
        display: flex;
        gap: 8px;
      }
      .confirm-actions button {
        padding: 7px 16px;
        border-radius: 8px;
        border: 1px solid #e94560;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .confirm-actions .yes {
        background: #e94560;
        color: #fff;
      }
      .confirm-actions .no {
        background: #fff;
        color: #e94560;
      }
      .confirm-actions button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .confirm-done {
        font-size: 0.82rem;
        color: #667;
      }

      /* ── TRACE SUMMARY ── */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }
      .stat {
        background: #f7f7fb;
        border-radius: 8px;
        padding: 8px 10px;
      }
      .stat .v {
        font-size: 1.1rem;
        font-weight: 700;
      }
      .stat .k {
        font-size: 0.72rem;
        color: #888;
      }
      .tool-stats {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      .tool-stats th,
      .tool-stats td {
        text-align: left;
        padding: 4px 2px;
        border-bottom: 1px solid #f0f0f0;
      }
      .tool-stats td:not(:first-child),
      .tool-stats th:not(:first-child) {
        text-align: right;
      }
      /* ── LANGUAGE SWITCH ── */
      .lang-switch {
        display: flex;
        border: 1px solid #0f3460;
        border-radius: 20px;
        overflow: hidden;
        margin-left: 12px;
      }
      .lang-switch button {
        background: none;
        border: none;
        color: #aaa;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 3px 10px;
        cursor: pointer;
      }
      .lang-switch button.active {
        background: #e94560;
        color: #fff;
      }
    </style>
  </head>
  <body{% if embed %} class="embed"{% endif %}>
    <!-- HEADER -->
    <header>
      <span class="logo">📱</span>
      <h1>Shopping Assistant</h1>
      <span class="badge">AI</span>
      <span class="sub" data-i18n="app.subtitle">Tư vấn điện thoại thông minh</span>
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="vi" onclick="setLang('vi')">VI</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </header>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('chat')" data-i18n="tab.chat">Chat AI</button>
      <button class="tab-btn" onclick="switchTab('products')" data-i18n="tab.products">Sản phẩm</button>
      <button class="tab-btn" onclick="switchTab('health')" data-i18n="tab.health">Hệ thống</button>
      <button class="new-chat-btn" onclick="newChat()" data-i18n="chat.new" data-i18n-title="chat.newTitle">
        + Hội thoại mới
      </button>
    </div>

    <!-- CHAT PANEL -->
    <div id="panel-chat" class="tab-panel active">
      <div class="chat-messages" id="chatMessages">
        <div class="msg bot">
          <div class="avatar">🤖</div>
          <div>
            <div class="bubble" id="welcome" data-i18n-html="chat.welcome"></div>
          </div>
        </div>
      </div>

      <div class="input-bar">
        <textarea
          id="userInput"
          placeholder="Hỏi về điện thoại bạn muốn mua..." data-i18n-placeholder="chat.placeholder"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" data-i18n="chat.send">Gửi</button>
      </div>
    </div>

    <!-- PRODUCTS PANEL -->
    <div id="panel-products" class="tab-panel">
      <div class="products-header">
        <div>
          <h2 data-i18n="products.title">Danh sách sản phẩm</h2>
          <div class="products-source" data-i18n="products.source">Dữ liệu trực tiếp từ Odoo</div>
        </div>
        <button class="refresh-btn" onclick="loadProducts()" data-i18n="common.reload">Tải lại</button>
      </div>
      <div class="products-grid" id="productsGrid">
        <p style="color: #999; font-size: 0.9rem" data-i18n="common.loading">Đang tải...</p>
      </div>
    </div>

    <!-- HEALTH PANEL -->
    <div id="panel-health" class="tab-panel">
      <div class="health-card">
        <h2 data-i18n="health.status">Trạng thái hệ thống</h2>
        <div id="healthRows">
          <div class="health-row"><span data-i18n="health.checking">Đang kiểm tra...</span></div>
        </div>
      </div>
      <div class="health-card">
        <h2 data-i18n="health.activity">Hoạt động 24 giờ qua</h2>
        <div id="traceSummary">
          <div class="health-row"><span data-i18n="common.loading">Đang tải...</span></div>
        </div>
      </div>
      <button class="health-refresh" onclick="loadHealth()" data-i18n="health.recheck">Kiểm tra lại</button>
    </div>

    <script>
      // ── I18N ────────────────────────────────────────────────────
      const I18N = {
        vi: {

          "products.ask": "Hỏi về sản phẩm này",
          "products.askText": "Cho mình biết chi tiết về {name}",
          "spec.chip": "Chip",
          "spec.ram": "RAM",
          "spec.storage": "Bộ nhớ",
          "spec.screen": "Màn hình",
          "spec.battery": "Pin",
          "spec.charging": "sạc",
          "spec.camera": "Camera",
          "stock.left": "Còn {n} chiếc",
          "stock.low": "Chỉ còn {n}",
          "stock.out": "Hết hàng",
          "col.product": "Sản phẩm",

      // Ngon ngu: ?lang=en tren URL > lua chon da luu > tieng Viet
      let lang = (() => {
        const fromUrl = new URLSearchParams(location.search).get("lang");
        let saved = null;
        try {
          saved = localStorage.getItem("lang");
        } catch {}
        const value = fromUrl || saved || "vi";
        return I18N[value] ? value : "vi";
      })();

      function locale() {
        return lang === "en" ? "en-US" : "vi-VN";
      }

      function t(key, vars, fallback) {
        let text = (I18N[lang] && I18N[lang][key]) ?? I18N.vi[key] ?? fallback ?? key;
        for (const [k, v] of Object.entries(vars || {})) text = text.replaceAll(`{${k}}`, v);
        return text;
      }

      function applyI18n() {
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
        document.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = t(el.dataset.i18nHtml)));
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => (el.placeholder = t(el.dataset.i18nPlaceholder)));
        document.querySelectorAll("[data-i18n-title]").forEach((el) => (el.title = t(el.dataset.i18nTitle)));
        document.querySelectorAll(".lang-switch button").forEach((b) => b.classList.toggle("active", b.dataset.lang === lang));
      }

      function setLang(value) {
        if (!I18N[value] || value === lang) return;
        lang = value;
        try {
          localStorage.setItem("lang", lang);
        } catch {}
        applyI18n();
        const active = document.querySelector(".tab-panel.active");
        if (active && active.id === "panel-products") loadProducts();
        if (active && active.id === "panel-health") loadHealth();
      }

      applyI18n();
      // ── SESSION MANAGEMENT ──────────────────────────────────────
      let sessionId = localStorage.getItem("session_id") || crypto.randomUUID();
      localStorage.setItem("session_id", sessionId);

      function newChat() {
        // Xoa session tren server
        fetch("/api/session/clear", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId }),
        }).catch(() => {});

        // Tao session moi
        sessionId = crypto.randomUUID();
        localStorage.setItem("session_id", sessionId);

        // Xoa chat messages (giu lai welcome message)
        const wrap = document.getElementById("chatMessages");
        const msgs = wrap.querySelectorAll(".msg");
        msgs.forEach((m, i) => {
          if (i > 0) m.remove();
        });

        switchTab("chat");
      }

      // ── TAB SWITCHING ────────────────────────────────────────────
      function switchTab(tab) {
        document.querySelectorAll(".tab-btn").forEach((b, i) => {
          const names = ["chat", "products", "health"];
          b.classList.toggle("active", names[i] === tab);
        });
        document
          .querySelectorAll(".tab-panel")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById("panel-" + tab).classList.add("active");

        if (tab === "products") loadProducts();
        if (tab === "health") loadHealth();
      }

      // ── CHAT ────────────────────────────────────────────────────
      function autoResize(el) {
        el.style.height = "44px";
        el.style.height = Math.min(el.scrollHeight, 120) + "px";
      }

      function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      function appendMsg(role, html, meta) {
        const wrap = document.getElementById("chatMessages");
        const div = document.createElement("div");
        div.className = "msg " + role;

        const avatar = role === "user" ? "🧑" : "🤖";
        let inner = `<div class="avatar">${avatar}</div><div>`;
        inner += `<div class="bubble">${html}</div>`;

        if (meta) {
          inner += `<div class="meta">`;
          if (meta.intent) inner += `<span>intent: ${meta.intent}</span>`;
          (meta.tools_called || []).forEach((t) => {
            inner += `<span class="tool-tag">${t}</span>`;
          });
          inner += `</div>`;
          if (meta.warning) {
            inner += `<div class="warning-msg">⚠ ${meta.warning}</div>`;
          }
        }

        inner += "</div>";
        div.innerHTML = inner;
        wrap.appendChild(div);
        wrap.scrollTop = wrap.scrollHeight;
        return div;
      }


      // ── STREAMING CHAT ──────────────────────────────────────────


      // Doc SSE tu fetch POST; goi onEvent cho moi su kien JSON
      async function postStream(url, body, onEvent) {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            const raw = buf.slice(0, i);
            buf = buf.slice(i + 2);
            if (raw.startsWith("data: ")) onEvent(JSON.parse(raw.slice(6)));
          }
        }
      }

      // Bong bot "song": hien trang thai tool, chu dang stream, roi cau tra loi cuoi
      function liveBot() {
        const wrap = document.getElementById("chatMessages");
        const div = document.createElement("div");
        div.className = "msg bot";
        div.innerHTML = `<div class="avatar">🤖</div><div class="body">
          <div class="bubble"><div class="status-line"></div><div class="content">
          <div class="typing"><span></span><span></span><span></span></div></div></div></div>`;
        wrap.appendChild(div);
        wrap.scrollTop = wrap.scrollHeight;
        const status = div.querySelector(".status-line");
        const content = div.querySelector(".content");
        let draft = "";
        const scroll = () => (wrap.scrollTop = wrap.scrollHeight);
        return {
          div,
          tool(name) {
            status.textContent = t("tool." + name, null, t("tool.default"));
            scroll();
          },
          token(text) {
            draft += text;
            content.innerHTML = marked.parse(draft);
            scroll();
          },
          reset() {
            draft = "";
            content.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
          },
          final(data) {
            status.textContent = "";
            if (data.error) {
              content.innerHTML = `<span style="color:#c62828">${t("common.error")}: ${escapeHtml(data.error)}</span>`;
              return;
            }
            content.innerHTML = marked.parse(data.answer_markdown || "");
            if (data.pending_confirmation) renderConfirm(content, data.pending_confirmation);
            const body = div.querySelector(".body");
            let meta = `<div class="meta"><span>intent: ${data.intent}</span>`;
            (data.tools_called || []).forEach((t) => (meta += `<span class="tool-tag">${t}</span>`));
            meta += "</div>";
            if (data.warning) meta += `<div class="warning-msg">⚠ ${escapeHtml(data.warning)}</div>`;
            body.insertAdjacentHTML("beforeend", meta);
            scroll();
          },
        };
      }

      function vnd(n) {
        return n == null ? "—" : Number(n).toLocaleString(locale()) + " ₫";
      }

      // The xac nhan don hang (LangGraph interrupt) voi nut Xac nhan / Huy
      function renderConfirm(container, pending) {
        const rows = (pending.orders || [])
          .map((o) => {
            const total = o.unit_price && o.quantity ? o.unit_price * o.quantity : null;
            return `<tr><td>${escapeHtml(o.product_name || t("confirm.product") + " #" + o.product_id)} × ${o.quantity}</td><td>${vnd(total)}</td></tr>`
              + (o.customer_name || o.customer_phone
                ? `<tr><td>${t("confirm.recipient")}</td><td>${escapeHtml([o.customer_name, o.customer_phone].filter(Boolean).join(" · "))}</td></tr>`
                : "");
          })
          .join("");
        const card = document.createElement("div");
        card.className = "confirm-card";
        card.innerHTML = `<h4>${t("confirm.title")}</h4><table>${rows}</table>
          <div class="confirm-actions"><button class="yes">${t("confirm.yes")}</button><button class="no">${t("confirm.no")}</button></div>`;
        container.appendChild(card);
        const [yes, no] = card.querySelectorAll("button");
        const answer = async (approved) => {
          yes.disabled = no.disabled = true;
          card.querySelector(".confirm-actions").outerHTML =
            `<div class="confirm-done">${approved ? t("confirm.approved") : t("confirm.rejected")}</div>`;
          await runStream("/api/chat/confirm/stream", { session_id: sessionId, approved, lang });
        };
        yes.onclick = () => answer(true);
        no.onclick = () => answer(false);
      }

      async function runStream(url, body) {
        const btn = document.getElementById("sendBtn");
        btn.disabled = true;
        const bot = liveBot();
        let finished = false;
        try {
          await postStream(url, body, (ev) => {
            if (ev.type === "token") bot.token(ev.text);
            else if (ev.type === "tool") bot.tool(ev.name);
            else if (ev.type === "reset") bot.reset();
            else if (ev.type === "final") {
              finished = true;
              if (ev.session_id) {
                sessionId = ev.session_id;
                localStorage.setItem("session_id", sessionId);
              }
              bot.final(ev);
            } else if (ev.type === "error") {
              finished = true;
              bot.final({ error: ev.error });
            }
          });
          if (!finished) bot.final({ error: t("chat.disconnected") });
        } catch (err) {
          bot.final({ error: t("common.noServer") });
        } finally {
          btn.disabled = false;
          document.getElementById("userInput").focus();
        }
      }

      async function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (!text) return;
        // Dang cho xac nhan ma khach go tin moi: server se coi nhu huy don
        document.querySelectorAll(".confirm-actions").forEach((el) => {
          el.outerHTML = `<div class="confirm-done">${t("confirm.abandoned")}</div>`;
        });
        appendMsg("user", escapeHtml(text));
        input.value = "";
        input.style.height = "44px";
        await runStream("/api/chat/stream", { message: text, session_id: sessionId, lang });
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // ── PRODUCTS ────────────────────────────────────────────────
      async function loadProducts() {
        const grid = document.getElementById("productsGrid");
        grid.innerHTML =
          `<p style="color:#999;font-size:.9rem">${t("common.loading")}</p>`;

        try {
          const res = await fetch("/api/products");
          const data = await res.json();

          if (data.error) {
            grid.innerHTML = `<p style="color:red">${data.error}</p>`;
            return;
          }

          grid.innerHTML = "";
          (data.products || []).forEach((p) => {
            const storage = (p.storage_gb || []).map((x) => (x >= 1024 ? x / 1024 + "TB" : x + "GB")).join(" / ");
            const specs = [
              [t("spec.chip"), p.chipset],
              [t("spec.ram"), p.ram_gb + " GB"],
              [t("spec.storage"), storage],
              [t("spec.screen"), `${p.screen_inch}" ${p.refresh_rate_hz}Hz`],
              [t("spec.battery"), p.battery_mah + " mAh" + (p.charging_w ? `, ${t("spec.charging")} ${p.charging_w}W` : "")],
              [t("spec.camera"), p.main_camera_mp + " MP"],
            ];
            const specsHtml = specs.map(([k, v]) => `<li><strong>${k}:</strong> ${v}</li>`).join("");

            const card = document.createElement("div");
            card.className = "product-card";

            let stockCls = "stock-ok";
            let stockText = t("stock.left", { n: p.stock });
            if (p.stock === 0) {
              stockCls = "stock-out";
              stockText = t("stock.out");
            } else if (p.stock <= 5) {
              stockCls = "stock-low";
              stockText = t("stock.low", { n: p.stock });
            }

            card.innerHTML = `
        <span class="brand-badge">${p.brand}</span>
        <span class="stock-badge ${stockCls}">${stockText}</span>
        <h3>${p.name}</h3>
        <div class="price">${Number(p.price).toLocaleString(locale())} ₫</div>
        <ul class="specs">${specsHtml}</ul>
        <button class="ask-btn" onclick="askAbout('${p.name}')">${t("products.ask")}</button>
      `;
            grid.appendChild(card);
          });
        } catch {
          grid.innerHTML = `<p style="color:red">${t("common.loadFailed")}</p>`;
        }
      }

      function askAbout(name) {
        switchTab("chat");
        document.getElementById("userInput").value =
          t("products.askText", { name });
        document.getElementById("userInput").focus();
      }

      async function loadHealth() {
        const rows = document.getElementById("healthRows");
        rows.innerHTML =
          `<div class="health-row"><span>${t("health.checking")}</span></div>`;

        try {
          const res = await fetch("/api/health");
          const data = await res.json();

          const keys = ["postgres", "qdrant", "odoo"];
          const labels = {
            postgres: "PostgreSQL",
            qdrant: "Qdrant",
            odoo: "Odoo",
          };

          rows.innerHTML = keys
            .map((k) => {
              const ok = data[k] === "OK";
              const cls = ok ? "ok" : "fail";
              const val = ok ? "OK" : data[k];
              return `<div class="health-row"><span>${labels[k]}</span><span class="${cls}">${val}</span></div>`;
            })
            .join("");
        } catch {
          rows.innerHTML =
            `<div class="health-row"><span style="color:red">${t("common.noServer")}</span></div>`;
        }
        loadTraceSummary();
      }

      async function loadTraceSummary() {
        const el = document.getElementById("traceSummary");
        try {
          const d = await (await fetch("/api/traces/summary")).json();
          const ms = (v) => (v == null ? "—" : v >= 1000 ? (v / 1000).toFixed(1) + " s" : v + " ms");
          const num = (v) => Number(v || 0).toLocaleString(locale());
          const tools = (d.tools || [])
            .map((t) => `<tr><td>${t.name}</td><td>${t.calls}</td><td>${ms(t.avg_ms)}</td><td>${t.errors}</td></tr>`)
            .join("");
          el.innerHTML = `<div class="stats-grid">
              <div class="stat"><div class="v">${num(d.turns.count)}</div><div class="k">${t("stats.turns")}</div></div>
              <div class="stat"><div class="v">${ms(d.turns.avg_ms)} / ${ms(d.turns.p95_ms)}</div><div class="k">${t("stats.latency")}</div></div>
              <div class="stat"><div class="v">${num(d.llm.calls)}</div><div class="k">${t("stats.llmCalls")} ${ms(d.llm.avg_ms)}</div></div>
              <div class="stat"><div class="v">${num(d.llm.prompt_tokens)} / ${num(d.llm.completion_tokens)}</div><div class="k">${t("stats.tokens")}</div></div>
            </div>
            <table class="tool-stats"><tr><th>Tool</th><th>${t("stats.calls")}</th><th>${t("stats.avg")}</th><th>${t("stats.errors")}</th></tr>${tools || `<tr><td colspan="4">${t("stats.noData")}</td></tr>`}</table>`;
        } catch {
          el.innerHTML = `<div class="health-row"><span style="color:red">${t("stats.failed")}</span></div>`;
        }
      }
    </script>
