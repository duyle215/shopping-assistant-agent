      tools: [search_products]
      args: {search_products: {price_max: {lte: 15000000}}}
      contains_any: ["iPhone 13"]
      not_contains: ["iPhone 15 Pro Max", "iPhone 16 Pro"]

- id: search-ram-16
  category: search
  turns:
