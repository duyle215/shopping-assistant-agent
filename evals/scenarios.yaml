      tools: [search_products]
      args: {search_products: {ram_min: {gte: 16}}}
      contains_any: ["14 Ultra", "Find X8", "ROG"]

- id: search-feature-leica
  category: search
  turns:
    - user: "Có máy nào camera Leica không?"
      tools: [search_products]
      contains_any: ["Xiaomi 14"]

- id: search-storage-1tb
  category: search
  turns:
    - user: "Máy nào có bản bộ nhớ 1TB?"
      tools: [search_products]
      contains_any: ["iPhone 15 Pro Max", "iPhone 16 Pro", "S24 Ultra", "Fold6"]

- id: search-price-lookup
  category: search
  turns:
    - user: "Pixel 8a giá bao nhiêu?"
      tools: [search_products]
