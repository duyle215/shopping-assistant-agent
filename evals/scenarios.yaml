# Kich ban danh gia hoi thoai. Chay: python scripts/eval_agent.py
#
# Moi kich ban co 1+ luot (turns). Moi luot co the kiem tra:
#   tools: [..]              cac tool PHAI duoc goi trong luot
#   not_tools: [..]          cac tool KHONG duoc goi
#   args: {tool: {field: rule}}   it nhat mot lan goi tool thoa moi rule
#       rule: gia tri (bang nhau, khong phan biet hoa thuong) | {lte: x} | {gte: x}
#             | {in: [..]} | {contains: [..]} (danh sach chua cac phan tu nay)
#   agent: SalesAgent | CompareAgent | blocked
#   contains_any / contains_all / not_contains: chuoi trong cau tra loi (khong phan biet hoa thuong)
#   pending_confirmation: true   phai hien the xac nhan don hang
#   confirm: approve | reject    bam nut tren the xac nhan (neu co)
#   allow_warning: true          cho phep response co canh bao
# Moi kich ban co the kiem tra DB sau khi chay:
#   db: {orders: n, order_status: confirmed|pending_restock, support_requests: n, stock: {id: so}}
# Luon kiem tra: khong loi, co cau tra loi, khong canh bao, moi muc gia trong cau tra loi co trong catalog.
#
# Catalog (data/catalog.jsonl): 1 iPhone 15 Pro Max, 2 iPhone 15, 3 iPhone 16 Pro, 4 iPhone 16,
# 5 iPhone 13, 6 S24 Ultra, 7 S24, 8 Z Fold6, 9 Z Flip6, 10 A55, 11 A35, 12 A15, 13 Xiaomi 14 Ultra,
# 14 Xiaomi 14, 15 Redmi Note 13 Pro 5G, 16 Redmi Note 13, 17 Redmi 13C, 18 POCO X6 Pro, 19 Find X8,
# 20 Reno12, 21 OPPO A58, 22 vivo V30, 23 vivo Y36, 24 Pixel 8 Pro, 25 Pixel 8a, 26 realme 12 Pro+,
# 27 realme C67, 28 Honor X9b, 29 Nothing Phone (2a), 30 ROG Phone 8 Pro

# ------------------------------------------------------------------ search
- id: search-brand-price-battery
  category: search
  turns:
    - user: "Samsung dưới 10 triệu pin trâu"
      tools: [search_products]
      not_tools: [place_order]
      args: {search_products: {brand: Samsung, price_max: {lte: 10000000}}}
      contains_any: ["A55", "A35", "A15"]
      not_contains: ["S24 Ultra", "Fold6"]

- id: search-under-5m
  category: search
  turns:
    - user: "Có điện thoại nào dưới 5 triệu không?"
      tools: [search_products]
      args: {search_products: {price_max: {lte: 5000000}}}
      contains_any: ["A15", "Redmi Note 13", "Redmi 13C", "A58", "C67"]
      not_contains: ["iPhone 15", "S24"]

- id: search-gaming-refresh-rate
  category: search
  turns:
    - user: "Mình chơi game nhiều, máy nào màn hình tần số quét cao nhất?"
      tools: [search_products]
      contains_any: ["ROG"]

- id: search-not-in-catalog-model
  category: search
  turns:
    - user: "Shop có bán iPhone 17 không?"
      tools: [search_products]
      contains_any: ["chưa có", "không có", "chưa kinh doanh", "hiện chưa", "không bán", "chưa bán"]

- id: search-not-in-catalog-brand
  category: search
  turns:
    - user: "Điện thoại Nokia nào rẻ nhất vậy shop?"
      tools: [search_products]
      contains_any: ["chưa có", "không có", "chưa kinh doanh", "hiện chưa", "không bán", "chưa bán"]

- id: search-ios-budget
  category: search
  turns:
