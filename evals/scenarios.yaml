      tools: [search_products]
      contains_any: ["Fold6", "Flip6"]

# ------------------------------------------------------------------ compare
- id: compare-two-flagships
  category: compare
  turns:
    - user: "So sánh iPhone 16 Pro và Galaxy S24 Ultra"
      tools: [compare_products]
      agent: CompareAgent
      args: {compare_products: {product_ids: {contains: [3, 6]}}}
      contains_all: ["| Tiêu chí |"]

- id: compare-battery-midrange
  category: compare
  turns:
    - user: "So sánh pin của Redmi Note 13 Pro và POCO X6 Pro"
      tools: [compare_products]
      args: {compare_products: {product_ids: {contains: [15, 18]}}}
      contains_any: ["5100"]

- id: compare-a55-a35
  category: compare
  turns:
    - user: "Galaxy A55 với A35 khác nhau thế nào?"
      tools: [compare_products]
      args: {compare_products: {product_ids: {contains: [10, 11]}}}

- id: compare-three-phones
  category: compare
  turns:
    - user: "So sánh giúp mình 3 máy: Xiaomi 14, OPPO Find X8 và vivo V30"
      tools: [compare_products]
      args: {compare_products: {product_ids: {contains: [14, 19, 22]}}}

- id: compare-lighter
  category: compare
  turns:
    - user: "Pixel 8 Pro và iPhone 15 Pro Max, máy nào nhẹ hơn?"
      tools: [compare_products]
      args: {compare_products: {product_ids: {contains: [1, 24]}}}
      contains_any: ["Pixel 8 Pro"]

- id: compare-follow-up-reference
  category: compare
  turns:
    - user: "Cho mình xem Galaxy S24"
      tools: [search_products]
    - user: "So sánh nó với iPhone 16"
      tools: [compare_products]
      args: {compare_products: {product_ids: {contains: [4, 7]}}}

- id: compare-unknown-product
  category: compare
  turns:
    - user: "So sánh iPhone 15 với Nokia 3310"
      not_tools: [place_order]
      contains_any: ["chưa có", "không có", "chưa kinh doanh", "không tìm thấy", "chưa bán", "không bán"]

- id: compare-then-buy
  category: compare
  turns:
    - user: "So sánh Redmi Note 13 và realme C67"
      tools: [compare_products]
    - user: "Vậy lấy cho mình 1 chiếc Redmi Note 13, tên An, số 0901112223"
      tools: [place_order]
      args: {place_order: {product_id: 16, quantity: 1}}
      pending_confirmation: true
      confirm: approve
  db: {orders: 1, order_status: confirmed, stock: {16: 49}}

